schema_version: 1.0
architecture: Aurora
architecture_version: 1.2
endianness: little
instruction_word_bits: 16
native_register_bits: 32
register_count: 16
primary_opcode_bits: 4
primary_opcode_map:
  0x0: ALU_REG
  0x1: ALU_IMM
  0x2: SHIFT_ROTATE
  0x3: MULDIV
  0x4: DSP_REDUCE
  0x5: PACK_SHUFFLE
  0x6: LOAD
  0x7: STORE
  0x8: BRANCH_COND
  0x9: CONTROL_FLOW
  0xA: STACK
  0xB: STREAM
  0xC: LOOP
  0xD: SYSTEM
  0xE: EXTENSION
  0xF: CUSTOM_RESERVED
modes:
  SCALAR32:
    code: 0
    lane_bits: 32
    lanes: 1
  PACKED16:
    code: 1
    lane_bits: 16
    lanes: 2
  PACKED8:
    code: 2
    lane_bits: 8
    lanes: 4
  LOW16:
    code: 3
    lane_bits: 16
    lanes: 1
    preserve_upper: true
  LOW8:
    code: 4
    lane_bits: 8
    lanes: 1
    preserve_upper: true
  PAIRED64:
    code: 5
    lane_bits: 64
    lanes: 1
    paired: true
  RESERVED6:
    code: 6
    reserved: true
  RESERVED7:
    code: 7
    reserved: true
registers:
  R0:
    abi: arg0_ret0_q0
  R1:
    abi: arg1_q0_hi
  R2:
    abi: arg2
  R3:
    abi: arg3
  R4:
    abi: temp_q1
  R5:
    abi: temp_q1_hi
  R6:
    abi: temp
  R7:
    abi: temp
  R8:
    abi: temp_a0
    accumulator: A0
  R9:
    abi: temp
  R10:
    abi: callee_saved_a1
    accumulator: A1
  R11:
    abi: callee_saved
  R12:
    abi: callee_saved_fp_optional
  R13:
    abi: link_register_conditional_gpr
  R14:
    abi: stack_pointer
  R15:
    abi: program_counter
paired64:
  writable_pairs:
    - "R0:R1"
    - "R2:R3"
    - "R4:R5"
    - "R6:R7"
    - "R8:R9"
    - "R10:R11"
    - "R12:R13"
  conditional_pairs:
    "R12:R13": valid only when LR value is not live or has been saved
  zero_extended_sources:
    - R14
    - R15
  forbidden_destinations:
    - R14
    - R15
issue:
  window_entries: 4
  width: 2
  architectural_retirement: in_order
  register_renaming: false
  general_reorder_buffer: false
  slots:
    A:
      - scalar_alu
      - control
      - address
      - simple_shuffle
    B:
      - packed_dsp
      - multiply
      - divide
      - reduction
      - stream
      - memory
